[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Nilesh Patil <4813079+nilesh-patil@users.noreply.github.com>"]
repository = "https://github.com/nilesh-patil/sciart"
homepage = "https://github.com/nilesh-patil/sciart"
readme = "README.md"

[workspace.dependencies]
sciart-core = { path = "crates/sciart-core" }
sciart-generators = { path = "crates/sciart-generators" }
# ADR-0023: the scenes, split by category behind the sciart-generators registry facade.
sciart-shared = { path = "crates/sciart-shared" }
sciart-scenes-cosmos = { path = "crates/sciart-scenes-cosmos" }
sciart-scenes-earth = { path = "crates/sciart-scenes-earth" }
sciart-scenes-physics = { path = "crates/sciart-scenes-physics" }
sciart-scenes-matter = { path = "crates/sciart-scenes-matter" }
sciart-scenes-life = { path = "crates/sciart-scenes-life" }
# WEB-R3: members that paint to a terminal turn on `terminal`; the capture crate does not.
sciart-render = { path = "crates/sciart-render", default-features = false }
sciart-keepawake = { path = "crates/sciart-keepawake" }
sciart-capture = { path = "crates/sciart-capture" }
sciart-testalloc = { path = "crates/sciart-testalloc" } # dev-only (ADR-0009)

anyhow = "1"
# RT-R22: only the features the code uses. clap: the derive API, help and usage text,
# error context and "did you mean" suggestions; no colour styling of help and errors.
clap = { version = "4.5", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
# CLI-R17: `sciart completions` and `sciart man`, generated from the clap definition.
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = "0.29"
enigo = "0.6"
# WEB-R3: no operating-system RNG in the scenes' tree (the browser has none); the binary
# turns on the default features for its random seed.
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
# RT-R22: the crossterm backend, buffers, styles and the `Widget` trait; no widget
# collection extras (calendar), layout cache or macros.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
# RT-R20: SIGTERM/SIGHUP restore the terminal (already in the tree through crossterm).
signal-hook = "0.3"
# RT-R22: the config is only parsed, never written.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2"

criterion = "0.8"
insta = "1"
portable-pty = "0.9"
proptest = "1"
# Parses `list --json` in tests (CLI-R16); already in the tree through criterion.
serde_json = "1"
tempfile = "3"
vt100 = "0.16"

# Headless capture (ADR-0025): the `font8x8` glyph atlas and the PNG/GIF encoders.
font8x8 = "0.3"
gif = "0.13"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

# ADR-0023: line tables only. Panics and backtraces keep file:line; full variable debuginfo
# (for stepping in lldb) costs compile and link time on every build and is rarely used here.
# Get it back for a debugging session with `CARGO_PROFILE_DEV_DEBUG=true`.
[profile.dev]
debug = "line-tables-only"

# `cargo build` / `rs-list` / the dev examples: the scene numerics at opt-level 1 so a dev
# `frames` run stays interactive. Bit-identical for f64 at any opt-level (Rust never
# contracts to FMA or reorders float ops; trigonometry goes through `Trig`, GEN-R6).
[profile.dev.package.sciart-core]
opt-level = 1

[profile.dev.package.sciart-shared]
opt-level = 1

[profile.dev.package.sciart-scenes-cosmos]
opt-level = 1

[profile.dev.package.sciart-scenes-earth]
opt-level = 1

[profile.dev.package.sciart-scenes-physics]
opt-level = 1

[profile.dev.package.sciart-scenes-matter]
opt-level = 1

[profile.dev.package.sciart-scenes-life]
opt-level = 1

# TEST-R10 / ADR-0023: tests (`rs-test` under nextest, and focused `cargo test` loops, which
# share these artefacts) run the lattice PDEs, N-body and Monte-Carlo sweeps for simulated
# minutes, so the test build is optimised. Debug assertions and overflow checks stay on:
# they are what makes this a test build and not a release build. Line tables only: panics
# and backtraces keep file:line, but the optimised build skips full variable debuginfo,
# which is slow to emit and link and useless after optimisation anyway.
[profile.test]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# `test` inherits `dev`, including its per-package overrides, which would pin the scene
# crates (the bulk of the test time) back to opt-level 1; a source rule keeps these lists
# in step (TEST-R10).
[profile.test.package.sciart-core]
opt-level = 2

[profile.test.package.sciart-shared]
opt-level = 2

[profile.test.package.sciart-scenes-cosmos]
opt-level = 2

[profile.test.package.sciart-scenes-earth]
opt-level = 2

[profile.test.package.sciart-scenes-physics]
opt-level = 2

[profile.test.package.sciart-scenes-matter]
opt-level = 2

[profile.test.package.sciart-scenes-life]
opt-level = 2

[profile.release]
panic = "unwind" # ADR-0006: catch_unwind quarantine needs unwinding
lto = "thin"
codegen-units = 1
# RT-R22 / ADR-0035: no symbol tables in the installed binary (-11.6 %, same frames and
# CPU). Panic messages keep their file:line locations; only backtraces lose names.
strip = true

# TEST-R9 / ADR-0023: the optimised snapshot run and the `rs-cost`/`rs-worst` probes. Same
# opt-level as `release`, but parallel codegen and no LTO: about half the build time.
# Frames do not depend on codegen partitioning or inlining (GEN-R6, ADR-0016), so this
# still catches an optimiser-dependent frame. `sciart` installs keep `release`.
[profile.ci]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = "off"
panic = "unwind"
incremental = false
# The probes are what gets profiled: keep the symbols `release` strips (RT-R22).
strip = "none"

[profile.bench]
debug = true
strip = "none"

[package]
name = "sciart-scenes-earth"
description = "Internal: the Earth & Sky and Voyages scenes of sciart. No semver promise; use the `sciart` crate"
# DIST-R3: the internal crates' shared 0.x version (scripts/bump_version.py).
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# DIST-R4: the published crate is the library alone.
exclude = ["tests/", "benches/", "examples/"]

[dependencies]
sciart-core.workspace = true
sciart-shared.workspace = true
rand.workspace = true

[dev-dependencies]
# The shared models' test helpers (`test-support`) for this crate's unit tests.
sciart-shared = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

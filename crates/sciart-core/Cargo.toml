[package]
name = "sciart-core"
description = "Internal: terminal-agnostic primitives of sciart (canvas, generator trait, fixed-step clock). No semver promise; use the `sciart` crate"
# DIST-R3: the internal crates' shared 0.x version (scripts/bump_version.py).
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# DIST-R4: the published crate is the library alone.
exclude = ["tests/", "benches/", "examples/"]

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
unicode-width.workspace = true

[dev-dependencies]
proptest.workspace = true
sciart-testalloc.workspace = true

[lints]
workspace = true

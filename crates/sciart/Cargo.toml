[package]
name = "sciart"
description = "Real-time generative science & astronomy art in your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["terminal", "generative-art", "astronomy", "ascii-art", "screensaver"]
categories = ["command-line-utilities", "graphics", "science", "science::astronomy", "visualization"]
# Not published to crates.io: installs are `cargo install --git` / a release tarball
# (IMP-05). Also lets cargo-deny allow the workspace's version-less path dependencies.
publish = false

[features]
# Real mouse-jiggle keep-awake backend (KA-R4); needs Accessibility permission on macOS.
mouse = ["sciart-keepawake/mouse"]
# CLI-R8 / ADR-0025: `sciart record` and its headless capture pipeline (GIF, PNG, asciicast).
# Off by default so the normal binary carries no image dependencies.
record = ["dep:sciart-capture"]

[dependencies]
sciart-core.workspace = true
sciart-generators.workspace = true
sciart-render.workspace = true
sciart-keepawake.workspace = true
sciart-capture = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
rand.workspace = true
rand_chacha.workspace = true
ratatui.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
gif.workspace = true
png.workspace = true
portable-pty.workspace = true
proptest.workspace = true
tempfile.workspace = true
vt100.workspace = true
sciart-testalloc.workspace = true

[lints]
workspace = true

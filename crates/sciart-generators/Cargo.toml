[package]
name = "sciart-generators"
description = "Internal: the scene registry of sciart. No semver promise; use the `sciart` crate"
# DIST-R3: the internal crates' shared 0.x version (scripts/bump_version.py).
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# DIST-R4: the published crate is the library alone.
exclude = ["tests/", "benches/", "examples/"]

[dependencies]
sciart-core.workspace = true
sciart-scenes-cosmos.workspace = true
sciart-scenes-earth.workspace = true
sciart-scenes-physics.workspace = true
sciart-scenes-matter.workspace = true
sciart-scenes-life.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
sciart-capture.workspace = true
sciart-render.workspace = true
sciart-testalloc.workspace = true
# CLI-R18: the capture glyph test skips glyphs wider than one cell.
unicode-width.workspace = true
# source_rules reads the scene crates' Cargo.toml manifests (GEN-R6/GEN-R16).
toml.workspace = true

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true

[package]
name = "sciart-shared"
description = "Scene models shared by several sciart scenes (never registered)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["simulation", "generative-art", "terminal", "ascii-art", "math"]
categories = ["science", "simulation", "graphics", "visualization"]
publish = false

[features]
# Measurement helpers the scenes' unit tests use (correlation lengths, box dimensions,
# capacities, reference terrain). Only the scene crates' dev-dependencies enable it, so
# normal builds never compile them.
test-support = []

[dependencies]
sciart-core.workspace = true
rand.workspace = true

[lints]
workspace = true

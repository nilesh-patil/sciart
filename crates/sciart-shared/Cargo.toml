[package]
name = "sciart-shared"
description = "Internal: scene models shared by several sciart scenes. No semver promise; use the `sciart` crate"
# DIST-R3: the internal crates' shared 0.x version (scripts/bump_version.py).
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# DIST-R4: the published crate is the library alone.
exclude = ["tests/", "benches/", "examples/"]

[features]
# Measurement helpers the scenes' unit tests use (correlation lengths, box dimensions,
# capacities, reference terrain). Only the scene crates' dev-dependencies enable it, so
# normal builds never compile them.
test-support = []

[dependencies]
sciart-core.workspace = true
rand.workspace = true

[lints]
workspace = true

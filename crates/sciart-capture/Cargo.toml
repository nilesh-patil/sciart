[package]
name = "sciart-capture"
description = "Headless frame capture for sciart: the preview renderer, PNG, GIF and asciicast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["generative-art", "gif", "png", "asciicast", "terminal"]
categories = ["graphics", "multimedia::images", "command-line-utilities"]
# ADR-0025: used by `sciart record` behind the `record` feature and by the preview example;
# never published.
publish = false

# LIB-R4: the GIF encoder only for `sciart record`; the PNG encoder by default (the browser
# build, WEB-R3, turns it off and keeps the renderer and the glyph font).
[features]
default = ["png"]
gif = ["dep:gif"]
# WEB-R3: the PNG encoder; the browser build draws pixels and encodes nothing.
png = ["dep:png"]

[dependencies]
sciart-core.workspace = true
sciart-render.workspace = true
font8x8.workspace = true
gif = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

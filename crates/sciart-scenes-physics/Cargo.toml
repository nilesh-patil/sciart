[package]
name = "sciart-scenes-physics"
description = "Internal: the Forces & Waves scenes of sciart. No semver promise; use the `sciart` crate"
# DIST-R3: the internal crates' shared 0.x version (scripts/bump_version.py).
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# DIST-R4: the published crate is the library alone.
exclude = ["tests/", "benches/", "examples/"]

[dependencies]
sciart-core.workspace = true
rand.workspace = true

[dev-dependencies]
# lbm.rs's inline spec tests (LBM-A1/A2).
proptest.workspace = true

[lints]
workspace = true

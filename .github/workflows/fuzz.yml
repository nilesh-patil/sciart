name: Fuzz

# IMP-14: scheduled, long-running fuzzing for the paths that accept arbitrary text.
# Deliberately not part of `rs-ci` (TEST-R3): cargo-fuzz needs nightly, a sanitizer and
# minutes per target, so this runs weekly and on demand instead. Crashes land in
# `fuzz/artifacts/<target>/` and the corpus is kept between runs; a crash becomes a
# regression test in the owning crate.
#
# Action versions are pinned by commit SHA; the tag/branch is in the trailing comment.

on:
  schedule:
    # Mondays 04:17 UTC (offset from the hour so it does not pile onto other cron jobs).
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # cargo-fuzz passes `-Z` flags, which only nightly accepts; `rust-toolchain.toml` floats
    # on stable and would otherwise win over the toolchain installed below (as release.yml
    # pins its MSRV the same way).
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [title_fit, hud_fit, theme_name]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-fuzz
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      # 90 s per target: three short runs weekly, not a continuous fuzzing service.
      - name: Fuzz ${{ matrix.target }} for 90 s
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        # The installed cargo-fuzz is a musl binary and would build for musl, where the
        # sanitizer cannot link; name the host triple (of the nightly rustc, as pinned above).
        run: |
          cargo fuzz run "$TARGET" --target "$(rustc -vV | sed -n 's/^host: //p')" -- -max_total_time=90 -rss_limit_mb=4096
      # Keep the corpus on success; keep artifacts even on a crash so the reproducer uploads.
      - name: Upload corpus and crashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

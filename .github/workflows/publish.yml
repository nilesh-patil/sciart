name: Publish

# SPEC-008 DIST-R10 / ADR-0033. Runs when a maintainer publishes the draft release that
# release.yml created. Each job below publishes to one channel and runs in the `release`
# environment, which requires a maintainer's approval before it starts: crates.io, the
# conda channel and the Homebrew tap. A manual run (`workflow_dispatch`) rehearses every job
# without uploading anything. Every job can be run again after a partial failure: crates
# already on crates.io are skipped (scripts/publish_crates.py), the channel upload skips
# packages it has, and the tap is committed only when the formula changed.
#
# Repository configuration this needs (see docs/RELEASING.md):
#   environment `release` with required reviewers (checked first by `environment-gate`);
#   secrets CARGO_REGISTRY_TOKEN, PREFIX_API_KEY, HOMEBREW_TAP_TOKEN (in that environment);
#   variables CONDA_CHANNEL (the prefix.dev channel) and HOMEBREW_TAP (owner/homebrew-repo).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rehearse (nothing is uploaded)
        required: true

permissions:
  contents: read

# One publish per tag at a time; a second run waits instead of racing the first.
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # DIST-R10: the hosting service creates a missing environment, without reviewers, the
  # first time a job names it, so a missing or unprotected `release` environment would let
  # the jobs below run unapproved. This job names no environment: it reads the rules and,
  # on a published release, stops everything unless a reviewer is required. A manual
  # rehearsal only reports what it found.
  environment-gate:
    name: The release environment requires a reviewer
    runs-on: ubuntu-24.04
    permissions:
      actions: read # GET /repos/{owner}/{repo}/environments/{name}
    steps:
      - name: Read the protection rules of the release environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" --jq '[.protection_rules[]?.type] | join(" ")')"; then
            echo "environment release: protection rules: ${rules:-none}"
          else
            rules=""
            echo "environment release: not found (or not readable with this token)"
          fi
          case " ${rules} " in
            *" required_reviewers "*)
              echo "environment release requires a reviewer" ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
                echo "::error::The release environment must exist and require a reviewer before anything is published (DIST-R10, docs/RELEASING.md)."
                exit 1
              fi
              echo "::notice::The release environment does not require a reviewer; a published release would stop here (DIST-R10)." ;;
          esac

  crates-io:
    name: crates.io
    needs: environment-gate
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Tag matches the version (DIST-R1)
        run: python3 scripts/release_check.py --tag "$TAG"
      # `cargo publish --workspace` needs cargo 1.90 or newer; the MSRV (1.88) only
      # constrains what users build with.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Rehearse (DIST-R4)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo publish --workspace --dry-run --locked
          python3 scripts/release_check.py --crates target/package
          python3 scripts/publish_crates.py --dry-run
      # DIST-R4: one crate at a time in dependency order, skipping versions already on the
      # index, so a rerun after a failure publishes only what is left.
      - name: Publish
        if: github.event_name == 'release'
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_crates.py

  conda:
    name: conda (${{ matrix.platform }})
    needs: environment-gate
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: osx-arm64
            os: macos-15
          - platform: osx-64
            os: macos-15
          - platform: linux-64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Tag matches the version (DIST-R1)
        run: python3 scripts/release_check.py --tag "$TAG"
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: dist
      - name: Build (DIST-R8)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: pixi run -e dist rs-conda-build --target-platform "$PLATFORM"
      - name: Upload to the channel
        if: github.event_name == 'release'
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
          CONDA_CHANNEL: ${{ vars.CONDA_CHANNEL }}
        run: |
          shopt -s globstar
          pixi run -e dist rattler-build upload prefix --skip-existing --channel "$CONDA_CHANNEL" target/conda/**/*.conda

  homebrew:
    name: Homebrew tap
    needs: environment-gate
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Tag matches the version (DIST-R1)
        run: python3 scripts/release_check.py --tag "$TAG"
      - name: Release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern SHA256SUMS --dir dist
      # DIST-R9: the formula from the template and the release's own SHA256SUMS.
      - name: Render the formula
        run: |
          python3 scripts/render_formula.py --version "${TAG#v}" --sums dist/SHA256SUMS --out Formula/sciart.rb
          ruby -c Formula/sciart.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'release'
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          path: tap
          persist-credentials: false
      # A rerun after the formula was pushed finds nothing to commit and succeeds.
      - name: Commit to the tap
        if: github.event_name == 'release'
        env:
          TAP: ${{ vars.HOMEBREW_TAP }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          mkdir -p tap/Formula
          cp Formula/sciart.rb tap/Formula/sciart.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sciart.rb
          if git diff --cached --quiet; then
            echo "the tap already has this formula"
          else
            git commit -m "sciart ${TAG#v}"
            git push "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" HEAD
          fi

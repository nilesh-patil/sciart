name: CI

# Hosted mirror of the local gate, `pixi run rs-ci` (TEST-R3), which stays the single
# definition of "green". The commands below mirror the pixi tasks and must be kept in step
# with `pixi.toml` (ADR-0024):
#   lint      = `cargo fmt --all --check` + clippy with and without `--all-features` (TEST-R3)
#   test      = doctests + every test under nextest (TEST-R10)
#   snapshots = the snapshot suite in the optimised `ci` profile (TEST-R9)
#   deny      = cargo-deny (advisories, licences, bans, sources; `deny.toml`)
#   semver    = cargo-semver-checks on the library against the published 1.0.0 (LIB-R8);
#               hosted only, not part of `rs-ci`
#   web       = the WebAssembly player and the docs site: `web-build`, `web-test`,
#               `site-build` and `site-check` (WEB-R3..R7); publishing is pages.yml (WEB-R8)
# Platform tiers (TEST-R13, ADR-0029), checked by `scripts/tooling_check.py`:
#   tier 1 = aarch64-apple-darwin (macos-14) and x86_64-unknown-linux-gnu (ubuntu-latest):
#            lint, the whole suite, and the frame-pinning suites (snapshots, m11_fidelity);
#   tier 2 = aarch64-unknown-linux-gnu (ubuntu-24.04-arm): the whole suite, in which the
#            frame-pinning suites skip themselves (frames are deterministic per platform);
#   tier 3 = x86_64-apple-darwin and the musl targets: release builds only (release.yml).
# A second `test` step re-runs only the colour-sensitive suites with NO_COLOR=1 (TEST-R12),
# so the ambient environment can never decide whether the gate is green.
# pixi is deliberately not used here: CI installs the toolchain directly (ADR-0024).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin to the MSRV the workspace declares (`rust-version = 1.88`): CI must not pass on a
  # newer compiler and never verify it. `rust-toolchain.toml` floats on `stable`, which
  # would otherwise win over the action's default toolchain, so force the rustup proxy.
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  lint:
    name: lint (${{ matrix.os }}, tier ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tier: 1
          - os: ubuntu-latest
            tier: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-features` builds the `mouse` backend, whose enigo links libxkbcommon on Linux.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # LIB-R4: the library as a library user builds it.
      - name: Clippy (library, no default features)
        run: cargo clippy -p sciart --all-targets --no-default-features -- -D warnings
      - name: Clippy (library, png and widget)
        run: cargo clippy -p sciart --all-targets --no-default-features --features png,widget -- -D warnings

  test:
    name: test (${{ matrix.os }}, tier ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tier: 1
          - os: ubuntu-latest
            tier: 1
          - os: ubuntu-24.04-arm
            tier: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Tests (nextest)
        run: cargo nextest run --workspace
      # TEST-R12: the colour-sensitive suites must also pass when the ambient
      # environment disables colour. Only pty_smoke and encoder_fidelity build
      # crossterm references or drive the real binary through colour paths; the
      # other 1600+ tests never read the ambient colour configuration, so they
      # are not re-run here.
      - name: Colour-sensitive suites (nextest, NO_COLOR=1)
        env:
          NO_COLOR: "1"
        run: cargo nextest run -p sciart --test pty_smoke --test encoder_fidelity
      # IMP-06: exactly one current frame per registered scene, no orphans.
      - name: Gallery coverage
        run: python3 scripts/gallery.py --check
      # WEB-R1/R2: the showcase clips match docs/showcase.toml, within the size limits, and
      # README.md / docs/GALLERY.md reference only manifest media.
      - name: Showcase manifest
        run: python3 scripts/showcase.py --check
      # GEN-R15: the generated SPEC-002 scene index is current.
      # TEST-R1/R4: spec traceability; TEST-R9/R10/R11/R13: tooling schema; RT-R22: the
      # size check's own tests (as `rs-spec-check`).
      - name: Spec index & tooling schema
        run: |
          python3 scripts/spec_index.py --check
          python3 scripts/spec_check.py
          python3 scripts/tooling_check.py
          python3 scripts/size_check_test.py
      # CLI-R15: the recorder is in the default build above; this is the build without it.
      - name: Tests without the recorder
        run: cargo nextest run -p sciart --no-default-features --features cli
      # LIB-R7: the library's doctests with every library feature, and its tests alone.
      - name: Library doctests (all library features)
        run: cargo test -p sciart --doc --features png,widget,unstable-generator
      - name: Library tests (no default features)
        run: cargo nextest run -p sciart --no-default-features --features png,widget,unstable-generator

  # WEB-R3: the player module is built on every push; WEB-R4..R7: the site is built from it
  # and checked (`pixi run site-check`). Publishing is pages.yml, never this workflow (WEB-R8).
  web:
    name: web (player module and docs site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            web -> web/target
      - name: Player module (WebAssembly)
        run: cargo build --release --locked --manifest-path web/Cargo.toml --target wasm32-unknown-unknown
      - name: Player tests (native)
        run: cargo test --locked --manifest-path web/Cargo.toml
      - name: The binary the site is built from (list, completions)
        run: cargo build --locked --profile ci -p sciart
      - name: Docs site
        run: |
          python3 scripts/build_site.py
          python3 scripts/site_check.py

  # LIB-R8: from the first release after 1.0.0, the library's public API is compared with
  # the published 1.0.0. Before then there is no baseline and the step says so.
  semver:
    name: semver (library API against 1.0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      - name: cargo-semver-checks
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          case "$version" in
            0.*|1.0.0) echo "sciart $version: no published 1.0.0 to compare against yet" ;;
            *) cargo semver-checks check-release -p sciart --baseline-version 1.0.0 \
                 --only-explicit-features --features png,widget ;;
          esac

  snapshots:
    name: snapshots (${{ matrix.os }}, ci profile)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tier: 1
          - os: ubuntu-latest
            tier: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # TEST-R9: frames must not depend on the optimiser; TEST-R13: pinned on tier 1.
      - name: Snapshot suite (optimised)
        run: cargo test --profile ci -p sciart-generators --test snapshots

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

name: Release

# IMP-05: a tagged release builds the binary for both macOS architectures and Linux and
# attaches one tarball + checksum per target. Release tags are created locally; this workflow
# never pushes a tag. `workflow_dispatch` exercises the build without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon is the primary platform.
          - target: aarch64-apple-darwin
            os: macos-14
          # Intel macOS is cross-built on the same Apple Silicon runner: macos-13 (the last
          # Intel image) was retired on 2025-12-04. The macOS SDK links both architectures.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pin the MSRV (workspace `rust-version` = 1.88), not `stable`: a release build is the
      # cheapest place to prove the minimum supported compiler still builds the crate.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p sciart --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # A release tarball without the licence or the front page is not a release.
          for file in README.md LICENSE; do
            test -f "$file" || { echo "::error::missing $file in the checkout"; exit 1; }
          done
          name="sciart-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/sciart" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          # GNU coreutils on Linux, perl's shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach binaries to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    # A manual dispatch only proves the build; there is no tag to attach to.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

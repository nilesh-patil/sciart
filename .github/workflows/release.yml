name: Release

# SPEC-008 / ADR-0033. A pushed `v*` tag builds the six release targets of the platform
# tiers (TEST-R13), packs one tarball per target plus the installer, writes SHA256SUMS,
# attests the build provenance of every asset and creates a DRAFT GitHub release (DIST-R5,
# DIST-R6). Nothing is published here: a maintainer reviews the draft and publishes it,
# which starts publish.yml (DIST-R10). The maintainer creates and pushes the tag; this
# workflow never creates or moves one (ADR-0024). `workflow_dispatch` runs every build and
# check without a release. Expressions reach `run:` scripts only through `env:`.
# Attestations are signed for public repositories only (DIST-R6): a tag pushed in a private
# repository fails in `verify` before anything is built, and a manual run there skips the
# attestation with a notice.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release build per tag at a time; a second push of the tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The MSRV (workspace `rust-version`): `rust-toolchain.toml` floats on `stable`, which
  # would otherwise win over the action's toolchain.
  RUSTUP_TOOLCHAIN: "1.88.0"

jobs:
  verify:
    name: Version, tag and release configuration
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # DIST-R6: build-provenance attestations are signed for public repositories only, so
      # a release from a private one would fail after every build. Refuse it first.
      - name: A release tag needs a public repository
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private
        run: |
          echo "::error::A release tag needs a public repository: build-provenance attestations are signed for public repositories only (DIST-R6). Make the repository public, then push the tag again; a manual run builds and checks everything without attesting."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DIST-R3..R10: the manifests, packaging files and both workflows.
      - name: Release configuration
        run: |
          python3 scripts/yaml_subset_test.py
          python3 scripts/release_check.py --require-ruby
          python3 scripts/release_check_test.py
          python3 scripts/publish_crates_test.py
          python3 scripts/conda_build_test.py
          python3 scripts/bump_version_test.py
      # DIST-R1: the tag is v{version} and the CHANGELOG has its heading.
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_check.py --tag "${GITHUB_REF_NAME}"
      - name: Installer against a fixture release (DIST-R7)
        run: python3 scripts/installer_check.py --require-shellcheck
      - id: version
        run: echo "version=$(python3 scripts/release_check.py --print-version)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} (tier ${{ matrix.tier }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux builds run on the oldest supported runner images, so the glibc
          # binaries need glibc 2.35 or newer (DIST-R5).
          - target: aarch64-apple-darwin
            os: macos-15
            tier: 1
            smoke: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            tier: 1
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            tier: 2
            smoke: true
          # Cross-built on Apple Silicon; it cannot run there without Rosetta.
          - target: x86_64-apple-darwin
            os: macos-15
            tier: 3
            smoke: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            tier: 3
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            tier: 3
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
        with:
          targets: ${{ matrix.target }}
      # No build cache: a release is built from the tagged sources alone, so a cache
      # written by another run cannot reach a released binary.
      # DIST-R6: the dependency list is embedded in the binary (`cargo auditable`).
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-auditable
      # RT-R22 / CLI-R15: both size budgets, on the platform they were measured on, from
      # plain release builds of this checkout (before the release build below).
      - name: Size budgets (RT-R22, CLI-R15)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo build --release --locked -p sciart --bin sciart --no-default-features --features cli
          python3 scripts/size_check.py --build lean
          cargo build --release --locked -p sciart --bin sciart
          python3 scripts/size_check.py --build default
      - name: Build
        env:
          SCIART_GIT_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --release --locked -p sciart --bin sciart --target "$TARGET"
      # DIST-R5: `-V` is the version, `--version` names the commit and target, and the
      # scene list parses.
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/sciart"
          test "$("$bin" -V)" = "sciart $VERSION"
          test "$("$bin" --version)" = "sciart $VERSION (${GITHUB_SHA:0:12} $TARGET)"
          "$bin" list --json | python3 -c 'import json, sys; assert json.load(sys.stdin)["scenes"]'
      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "bins/$TARGET"
          cp "target/$TARGET/release/sciart" "bins/$TARGET/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: bins/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Tarballs, checksums and attestations
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # sign the build-provenance attestations (DIST-R6)
      attestations: write # store them with the repository (DIST-R6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true
      # DIST-R5 / DIST-R6: completions and manual pages from the x86_64 Linux binary (they
      # are the same for every target), one tarball per target, install.sh, SHA256SUMS.
      - name: Pack
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          chmod +x bins/*/sciart
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 scripts/release_assets.py \
            --version "$VERSION" --bins bins \
            --tool bins/x86_64-unknown-linux-gnu/sciart --out dist
      - name: Checksums verify
        run: cd dist && sha256sum --check --strict SHA256SUMS
      # DIST-R6: signed for public repositories only; a manual run in a private one skips
      # it with a notice (a tag push there stopped in `verify`).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
      - name: Attestation skipped (private repository)
        if: github.event.repository.private
        run: |
          echo "::notice::No build-provenance attestations in this run: they are signed for public repositories only (DIST-R6)."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub release
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload its assets (DIST-R10)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 scripts/release_check.py --notes "$VERSION" > notes.md
      # DIST-R10: a draft, on the tag the maintainer pushed (`--verify-tag` fails rather
      # than create a tag). Publishing it is the maintainer's decision.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag \
            --title "sciart $VERSION" --notes-file notes.md

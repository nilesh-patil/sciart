# Showcase manifest (SPEC-009 WEB-R1): every animated capture in the README and the gallery.
#
# Each clip is recorded by `sciart record` with exactly these parameters; nothing is edited by
# hand or captured by another tool. `python3 scripts/showcase.py` (`pixi run rs-showcase`)
# records the missing clips, `--force` re-records all of them, and `--check`
# (`pixi run rs-showcase-check`, CI) enforces WEB-R2.
#
# Fields: `id` (unique), `scene` (a registered name), `seed`, `size` (WxH cells, 8x16 px per
# cell), `start` (simulated seconds before the first frame, `record --start`), `seconds`,
# `fps` (divides 60), `theme`, `out` (a .gif under docs/media/), `alt` (names the scene and
# says what the clip shows; the README and the gallery use it), and `readme`: "hero" (exactly
# one clip), "grid" (at least eight) or absent (gallery only).
#
# `start` picks each scene's best window: narrative scenes follow a timeline, and some open
# slowly. Most clips run at 20 fps (an exact 5/100 s GIF delay); the densest ones run at 15
# or 12 fps to stay under the 1.5 MB clip limit.


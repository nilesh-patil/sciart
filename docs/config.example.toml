# sciart config (SPEC-005). Copy to ~/.config/sciart/config.toml
# (or $XDG_CONFIG_HOME/sciart/config.toml). Every key is optional;
# command-line flags override these values. Unknown keys are an error.

fps = 30            # 1..=120
interval = 15       # seconds between scene changes in `sim`
theme = "astro"     # astro | rainbow | mono | aurora
ascii = false       # pure-ASCII glyphs
hud = false         # start with the status line visible (toggle with `h`)
title = true        # science title at the bottom-left, or in the HUD while it is on
                    # (`--no-title` turns it off)

# Excluded from `sim` cycling; `sciart run <name>` still works.
disabled = []

# caffeinate (macOS default) | mouse (needs `pixi run rs-install-mouse` + Accessibility
# permission) | off. A backend that can't start is a warning; the art keeps running.
keep_awake = "caffeinate"

# Drop to a lower frame rate when nobody is watching: after `idle_after` seconds
# without a key press, or while the terminal window is unfocused.
# Animations keep their real speed; only fewer frames are drawn. A picture that stops
# changing (paused, or a scene holding still) also steps down toward `fps` within
# 1.5 s and returns to full speed on the next change or key press.
[low_power]
idle_after = 120    # seconds (2 min)
fps = 5             # 1..=120


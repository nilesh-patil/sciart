[workspace]
authors = ["Nilesh <4813079+nilesh-patil@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "tasks-adhoc"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
sim = "python tools-py/art-terminal/activate.py"
lint = "ruff check tools-py/art-terminal"
format = "ruff format tools-py/art-terminal"
run_black_hole = "python tools-py/art-terminal/activate.py black_hole"
run_constellation_map = "python tools-py/art-terminal/activate.py constellation_map"
run_galaxy_collision = "python tools-py/art-terminal/activate.py galaxy_collision"
run_gravitational_lensing = "python tools-py/art-terminal/activate.py gravitational_lensing"
run_pulsar = "python tools-py/art-terminal/activate.py pulsar"
run_solar_system = "python tools-py/art-terminal/activate.py solar_system"
run_starfield = "python tools-py/art-terminal/activate.py starfield"
run_moon_phases = "python tools-py/art-terminal/activate.py moon_phases"
run_exoplanet_transit = "python tools-py/art-terminal/activate.py exoplanet_transit"
run_cosmic_microwave_background = "python tools-py/art-terminal/activate.py cosmic_microwave_background"
run_brownian_motion = "python tools-py/art-terminal/activate.py brownian_motion"
run_radioactive_decay = "python tools-py/art-terminal/activate.py radioactive_decay"
run_satellite_orbit = "python tools-py/art-terminal/activate.py satellite_orbit"
run_rocket_launch = "python tools-py/art-terminal/activate.py rocket_launch"
run_molecular_dynamics = "python tools-py/art-terminal/activate.py molecular_dynamics"
run_doppler_effect = "python tools-py/art-terminal/activate.py doppler_effect"
run_crystal_growth = "python tools-py/art-terminal/activate.py crystal_growth"
run_stellar_nursery = "python tools-py/art-terminal/activate.py stellar_nursery"
run_mars_rover = "python tools-py/art-terminal/activate.py mars_rover"
run_voyager_journey = "python tools-py/art-terminal/activate.py voyager_journey"
run_moon_landing = "python tools-py/art-terminal/activate.py moon_landing"
run_particle_accelerator = "python tools-py/art-terminal/activate.py particle_accelerator"
run_wave_interference = "python tools-py/art-terminal/activate.py wave_interference"
run_double_pendulum = "python tools-py/art-terminal/activate.py double_pendulum"
run_spacetime_grid = "python tools-py/art-terminal/activate.py spacetime_grid"
run_chemical_reaction = "python tools-py/art-terminal/activate.py chemical_reaction"
cleanup = "find . -name '__pycache__' -type d -exec rm -rf '{}' +"

[dependencies]
python-freethreading = ">=3.13.5,<4"
uv = ">=0.9.3,<0.10"
ruff = ">=0.14.1,<0.15"

[pypi-dependencies]
pyautogui = ">=0.9.54"
rich = ">=13.7.1"
art = ">=6.2"
colorama = ">=0.4.6, <0.5"

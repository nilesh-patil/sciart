[workspace]
authors = ["Nilesh Patil <4813079+nilesh-patil@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "sciart"
# TEST-R13: the tier-1 and tier-2 hosts plus Intel macOS (tier 3, builds only).
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
# DIST-R1: no version here; the root Cargo.toml holds the one version.

# Rust toolchain comes from rust-toolchain.toml via rustup; pixi is the task runner (ADR-0007).
# TEST-R11: every task runs with sccache as the rustc wrapper when it is installed.
[activation]
scripts = ["scripts/pixi-activate.sh"]

[tasks]
rs-build = "cargo build --workspace"
# TEST-R10: every test under nextest (parallel binaries, optimised `test` profile with debug
# assertions and overflow checks); doctests first, since nextest cannot run them. Extra
# arguments go to nextest: `pixi run rs-test <filter>`.
rs-test = "cargo test --workspace --doc && cargo nextest run --workspace"
# TEST-R10 evidence: rs-test runs exactly the tests `cargo test --workspace` lists.
rs-test-parity = "python3 scripts/test_set_parity.py"
# CLI-R15: the build without the recorder (`record` still parses and exits 2, CLI-R8).
# LIB-R7: the library's doctests with every library feature, and its tests on the library
# alone (`--no-default-features`: the facade without the binary's dependencies).
rs-test-features = "cargo nextest run -p sciart --no-default-features --features cli && cargo test -p sciart --doc --features png,widget,unstable-generator && cargo nextest run -p sciart --no-default-features --features png,widget,unstable-generator"
# GEN-R15: the generated scene index in SPEC-002-generators.md matches the category files.
# TEST-R1/R4: spec traceability (scripts/spec_check.py); TEST-R9/R10/R11: tooling schema
# (scripts/tooling_check.py) — the config half of the old source_rules tests, now scripts.
# DIST-R1..R10: the release configuration (scripts/release_check.py) and the installer
# against a fixture release (scripts/installer_check.py).
rs-spec-check = "python3 scripts/spec_index.py --check && python3 scripts/spec_check.py && python3 scripts/tooling_check.py && python3 scripts/size_check_test.py && python3 scripts/yaml_subset_test.py && python3 scripts/release_check.py && python3 scripts/release_check_test.py && python3 scripts/publish_crates_test.py && python3 scripts/conda_build_test.py && python3 scripts/installer_check.py"
# Since M22 the scene crates declare their modules with plain `pub mod` lines (ADR-0023), so
# `cargo fmt` reaches every scene file; no separate per-file rustfmt pass.
rs-fmt = "cargo fmt --all"
# LIB-R4: the library is also linted the way a library user builds it: with no default
# features, and with `png,widget`.
rs-lint = "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo clippy -p sciart --all-targets --no-default-features -- -D warnings && cargo clippy -p sciart --all-targets --no-default-features --features png,widget -- -D warnings"
# TEST-R9 / GEN-R6: frames must not depend on the optimiser, so the snapshots also run at
# opt-level 3 (the `ci` profile: release codegen without LTO, ADR-0023).
rs-snap-release = "cargo test --profile ci -p sciart-generators --test snapshots"
rs-ci = { depends-on = ["rs-lint", "rs-test", "rs-test-features", "rs-spec-check", "rs-snap-release", "rs-showcase-check"] }
rs-bench = "cargo bench -p sciart-generators"
# GEN-R8 worst single frame per scene (criterion reports means): `pixi run rs-worst [scene ...] --size 500x150`.
rs-worst = "cargo run -q --profile ci -p sciart-generators --example worst_frame --"
# RND-R13 per-scene CPU, terminal bytes and art metrics: `pixi run rs-cost [scene ...] [--size WxH] [--secs N] [--sort bytes]`.
rs-cost = "cargo run -q --profile ci -p sciart-qa --example cost --"
# The same probe on the install profile (thin LTO, one codegen unit): RT-R16's pipeline-mean CPU claim.
rs-cost-release = "cargo run -q --release -p sciart-qa --example cost --"
# RT-R22 / CLI-R15: release binary size and dependency-count budgets, for the binary without
# the recorder (`--no-default-features --features cli`) and then the default one (with
# `record`); each build is judged before the next replaces it.
rs-size = "cargo build -q --release -p sciart --bin sciart --no-default-features --features cli && python3 scripts/size_check.py --build lean && cargo build -q --release -p sciart --bin sciart && python3 scripts/size_check.py --build default"
rs-list = "cargo run -q -p sciart -- list"
# Interactive review runs share the `ci` build with the probes above; frames are the same as
# an installed (`release`) binary's (GEN-R6), which only links slower.
rs-sim = "cargo run --profile ci -p sciart -- sim"
rs-run = "cargo run --profile ci -p sciart -- run"
# Truecolor PNG frames for art review: `pixi run rs-preview <scene> --size 120x40 --t 0,5,20 --theme astro --out /tmp/p/<scene>`.
rs-preview = "cargo run -q --profile ci -p sciart-generators --example preview --"
# IMP-06: render missing `samples/current/<scene>.png` frames and regenerate `docs/GALLERY.md`.
# `rs-gallery-check` verifies one current frame per registered scene and no orphans (CI).
rs-gallery = "python3 scripts/gallery.py"
rs-gallery-check = "python3 scripts/gallery.py --check"
# WEB-R1: record the missing animated clips in `docs/showcase.toml` into `docs/media/` with
# `sciart record` (`--force` re-records all), then regenerate `docs/GALLERY.md`.
# WEB-R2: `rs-showcase-check` verifies clips, size limits, coverage and the README/gallery
# references (rs-ci and CI).
rs-showcase = "python3 scripts/showcase.py"
rs-showcase-check = "python3 scripts/showcase.py --check"
# RND-R19 art review: five scenes at 80x24/200x50 through the colorblind theme.
rs-colorblind-review = "python3 scripts/colorblind_review.py"
# Installs keep the `release` profile (thin LTO, one codegen unit) for runtime speed (TEST-R9).
rs-install = "cargo install --path crates/sciart"
rs-install-mouse = "cargo install --path crates/sciart --features mouse"
# CLI-R8/ADR-0025: the headless recorder; in default builds since CLI-R15, so
# `rs-install-record` is `rs-install` under its older name.
rs-install-record = "cargo install --path crates/sciart"
rs-record = "cargo run --profile ci -p sciart -- record"
# DIST-R4: every crate `cargo publish` would upload, packaged and verified together (needs
# cargo 1.90 or newer for `--workspace`; the MSRV stays 1.88), then the .crate files' sizes
# and contents.
rs-package-check = "cargo publish --workspace --dry-run --locked && python3 scripts/release_check.py --crates target/package"

[dependencies]
cargo-nextest = ">=0.9.148,<0.10"
sccache = ">=0.18.0,<0.19"

# DIST-R7 / DIST-R8 (ADR-0033): the release tools, in their own environment so the default
# one stays lean: `pixi run -e dist rs-conda-build`.
[feature.dist.dependencies]
rattler-build = ">=0.81.0,<0.82"
shellcheck = ">=0.11.0,<0.12"

[feature.dist.tasks]
# DIST-R8: the conda package for the host platform (or `--target-platform <platform>`),
# into target/conda; never uploaded from here.
rs-conda-build = "python3 scripts/conda_build.py"
# DIST-R7: the installer check with shellcheck required.
rs-installer-check = "python3 scripts/installer_check.py --require-shellcheck"

[environments]
dist = ["dist"]
